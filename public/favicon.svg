<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    DuckStudio favicon — "Custody Glass" direction seed ff937efc.
    OLED-black chassis (#050508), cyan custody lamp (#00f2fe) as the only
    chromatic voice at icon size; amber is reserved for the agent rail and
    stays out of the favicon so trust reads first.
  -->
  <rect width="64" height="64" rx="14" fill="#050508" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
  <!-- duck: body + head -->
  <path
    d="M14 34c0-1.1.9-2 2-2h4c-.7-1.8-1-3.7-1-5.5C19 20.6 24.4 16 31 16c5.2 0 9.6 2.9 11.3 7.2l7.2 1.9c1.6.4 1.9 2.5.5 3.4l-5.6 3.5c.4 3.4-.4 7-2.6 10.1C38.6 46.4 33.5 49 27.5 49 19.9 49 14 44 14 37.2Z"
    fill="#00f2fe"
  />
  <!-- eye -->
  <circle cx="31" cy="25.5" r="2.2" fill="#050508" />
  <!-- beak accent -->
  <path d="M42.8 26.8l7-1.8c.9 2.4.8 5.3-.6 7.6l-4.7-1.1c-.9-1.6-1.5-3.1-1.7-4.7Z" fill="#00f2fe" fill-opacity="0.55" />
</svg>
