name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The scaffold (package.json) hasn't landed yet — README "Local Development"
  # is explicit that the commands don't exist until it does. Gate on its
  # presence so docs-only commits stay green instead of failing install.
  gate:
    runs-on: ubuntu-latest
    outputs:
      scaffold: ${{ steps.check.outputs.scaffold }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: echo "scaffold=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, Type Check, Test & Build
    needs: gate
    if: needs.gate.outputs.scaffold == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input — pnpm/action-setup reads the exact pin from
      # package.json's `packageManager` field (pnpm@11.25.0, ticket 01), so
      # CI and local installs resolve the identical version.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint — ADR-0003)
        run: pnpm lint

      # ADR-0003: the trust-seam files get the strict rule set — plain lint
      # alone is not the gate the ADR promises.
      - name: Lint strict (trust-seam files — ADR-0003)
        run: pnpm lint:strict

      - name: Type check
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test

      # public/duckdb/ is gitignored — a clean checkout fetches the
      # exact-pinned wasm + workers once before the build guard lets
      # `vite build` run (CONTRIBUTING: Self-Hosted DuckDB-WASM Assets).
      - name: Download DuckDB-WASM runtime assets
        run: pnpm duckdb:download

      - name: Build
        run: pnpm build

  # AgDR-0001 "E2E layer": Playwright drives acceptance scenarios (sensitive
  # grid suppression, badge text, custody evidence, WebMCP-vs-simulator parity).
  # Chrome must carry the WebMCP testing flag — launch args live in the
  # scaffold's playwright.config, not here; CI just supplies the browser.
  e2e:
    name: E2E (Playwright)
    needs: gate
    if: needs.gate.outputs.scaffold == 'true'
    runs-on: ubuntu-latest
    # 25 min: per-test waits are bounded by e2e/agent-surface.ts's boot
    # absorption, but a full-suite run on a throttled runner needs headroom.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # --only-changed diffs against origin/<base_ref>, so the base
          # branch's tip must exist locally; the default depth-1 checkout
          # omits it and Playwright aborts with a shallow-clone error.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Same gitignored-assets fetch as the quality job — the build guard
      # requires them.
      - name: Download DuckDB-WASM runtime assets
        run: pnpm duckdb:download

      # Build before serving so e2e exercises the shipped static origin
      # (COOP/COEP headers included), not a dev server.
      - name: Build
        run: pnpm build

      # PRs whose diff is confined to e2e specs (or the Playwright config)
      # run only the changed files; every other diff runs the full suite.
      # --only-changed selects test files affected by the git diff, so an
      # app-only (src/) change would otherwise select zero specs and pass
      # without exercising the app at all. Pushes to main (no
      # github.base_ref, deploys ride on it) always run the full suite.
      # `pnpm e2e`, not `npx playwright`: the pinned @playwright/test
      # devDependency rules out a floating npx fetch, same as wrangler above.
      - name: Run E2E
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             git diff --quiet "origin/${{ github.base_ref }}" -- \
               . ':(exclude)e2e/*.spec.ts' ':(exclude)playwright.config.ts'; then
            pnpm e2e --only-changed="origin/${{ github.base_ref }}"
          else
            pnpm e2e
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Ticket 07's deliverable split reserves the CI deploy job + secrets for
  # the ship-gate ticket: production deploys fire only from main, after both
  # proof jobs are green, completing the install → lint → typecheck → test →
  # build → deploy lifecycle. `--branch main` names the project's production
  # branch explicitly; wrangler reads CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID from the environment, and the pinned wrangler
  # devDependency (4.127.1) rules out a floating `npx` at deploy time.
  deploy:
    name: Deploy (Cloudflare Pages)
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level group overrides the workflow's cancel-in-progress policy: a
    # production deploy is never cancelled mid-flight by a follow-up push;
    # concurrent main pushes queue instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same gitignored-assets fetch as the quality job — the build guard
      # requires them, and the deployed dist must serve them.
      - name: Download DuckDB-WASM runtime assets
        run: pnpm duckdb:download

      - name: Build
        run: pnpm build

      - name: Deploy dist to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name duckstudio --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Ticket 65 (grilling 62's resolution): the pre-publish audit runs against
  # the live origin after every production deploy and its four-pillar
  # breakdown (shared experience 30 / task completion 25 / tool quality 25 /
  # trust 20) is recorded in the job log. Informational by ruling — the
  # external CLI must not gate the pipeline on flakiness; the binding
  # assertion (score ≥ 70 overall, availability gate passed) is made in the
  # release PR per docs/release-checklist.md.
  audit:
    name: Audit (webmcp-audit on the live origin)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record the four-pillar audit breakdown
        continue-on-error: true
        env:
          # The audited origin defaults to production and is overridable via
          # the AUDIT_ORIGIN repository variable (e.g. to audit a preview).
          AUDIT_ORIGIN: ${{ vars.AUDIT_ORIGIN != '' && vars.AUDIT_ORIGIN || 'https://duckstudio.pages.dev' }}
        run: |
          # ax is pinned (no floating npx, same rule as wrangler above) and
          # retried ×3 — the external origin intermittently sheds probes.
          for attempt in 1 2 3; do
            if npx -y ax@0.7.1 webmcp-audit "$AUDIT_ORIGIN"; then
              exit 0
            fi
            echo "audit attempt ${attempt}/3 failed; retrying…"
            sleep 10
          done
          echo "audit failed after 3 attempts"
          exit 1
