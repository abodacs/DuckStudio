    <!--
    DIRECTION CONTRACT — "Custody Glass" (concept seed ff937efc; brief-pinned:
    high-end-visual-design / Ethereal Glass, replacing the flat instrument panel).
    THESIS: the lab is a dark optical instrument lit by its own two signal lamps —
    cyan = custody/trust, amber = the agent — and every surface is glass you can
    see custody through. It refuses the category's flat admin-panel arrangement.
    OWN-WORLD: OLED-black chassis (#050508) with two fixed radial lamp fields
    (cyan over evidence, amber over the agent rail); translucent white-glass
    panels with 1px white hairlines, soft ambient depth shadows, concentric
    double-bezel construction (18px outer / 14px inner); Geist for UI, Space
    Grotesk for display numerals, JetBrains Mono for machine values; cyan and
    amber are the only chromatic voices.
    STORY: a visitor reads the two-lamp custody model from the room itself,
    follows the three-move first-analysis path (activate → ask → evidence),
    and reaches the aha — governed evidence on glass while the badge still
    reads 0 Bytes of Dataset Uploaded.
    FIRST VIEWPORT: floating glass header island over two scrolling panes;
    left rail opens with the three-move first-run card, then context,
    operation, artifacts, datasets, custody; right pane is one full-height
    glass evidence instrument with a sticky blurred tab island and ghost
    readouts teaching each view's custody rule.
    FORM: brief-pinned Ethereal Glass (variance: double-bezel bento rail +
    floating HUD island, not the marketing-scroll archetype); staging keeps
    the PRD two-pane contract.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
    -->
